name: Build and Release Trazo
on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  native-build:
    name: Native build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build Radar
        run: |
          export CC="${CC:-gcc}"
          "$CC" -std=c11 -O2 -g -Wall -Wextra -Werror -Wshadow -Wvla \
            -Wconversion -Wformat-security -Werror=format \
            -fstack-protector-strong -D_FORTIFY_SOURCE=3 \
            Radar/lexer.c Radar/parser.c Radar/validator.c \
            Radar/build_plan.c Radar/main.c -o Radar/radar
          RADAR="./Radar/radar"
          if [ -f "${RADAR}.exe" ]; then RADAR="${RADAR}.exe"; fi
          test -x "$RADAR" || test -f "$RADAR"
          "$RADAR" check Radar/Radar.toml
          "$RADAR" plan Radar/Radar.toml
          "$RADAR" build Radar/Radar.toml
        shell: bash

      - name: Run smoke test
        run: |
          TRAZO="./bin/Trazo"
          if [ -f "${TRAZO}.exe" ]; then TRAZO="${TRAZO}.exe"; fi
          test -x "$TRAZO" || test -f "$TRAZO"
          "$TRAZO" --cOnly --output=bin/hello-generated.c \
            examples_ejemplos/hello_world.trz
          test -s bin/hello-generated.c
        shell: bash

      - name: Prepare artifact directory structure
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            VERSION="v0.1.0-alpha"
          fi
          
          DIR_NAME="Trazo-${VERSION}-${{ matrix.os }}"
          mkdir -p "dist/${DIR_NAME}"

          if [ -f ./Radar/radar.exe ]; then
            cp Radar/radar.exe "dist/${DIR_NAME}/"
          elif [ -f ./Radar/radar ]; then
            cp Radar/radar "dist/${DIR_NAME}/"
          else
            echo "Radar binary was not produced"
            exit 1
          fi
          
          if [ -f ./bin/Trazo.exe ]; then
            cp bin/Trazo.exe "dist/${DIR_NAME}/"
          elif [ -f ./bin/Trazo ]; then
            cp bin/Trazo "dist/${DIR_NAME}/"
          elif [ -f ./Trazo ]; then
            cp Trazo "dist/${DIR_NAME}/"
          else
            echo "Trazo binary was not produced"
            exit 1
          fi
          
          echo "DIR_NAME=${DIR_NAME}" >> $GITHUB_ENV
        shell: bash

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  publish-prerelease:
    name: Create GitHub Pre-Release
    needs: [native-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts-to-publish

      - name: Prepare assets for release
        run: |
          mkdir ./release-assets
          
          VERSION="${{ github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            VERSION="v0.1.0-alpha"
          fi
          
          cd ./artifacts-to-publish
          for os_dir in binaries-*; do
            [ -d "$os_dir" ] || continue
            
            OS_NAME="${os_dir#binaries-}"
            FOLDER_NAME="Trazo-${VERSION}-${OS_NAME}"
            
            mkdir -p "$FOLDER_NAME"
            cp -r "$os_dir"/* "$FOLDER_NAME/"
            
            echo "Archiving: $FOLDER_NAME"
            if [[ "$OS_NAME" == *"windows"* ]]; then
              zip -r "../release-assets/${FOLDER_NAME}.zip" "$FOLDER_NAME"
            else
              tar -czf "../release-assets/${FOLDER_NAME}.tar.gz" "$FOLDER_NAME"
            fi
          done
          
          cd ..
          ls -la ./release-assets
        shell: bash

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          prerelease: true
          generate_release_notes: true
          name: "Trazo ${{ github.ref_name }} Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}